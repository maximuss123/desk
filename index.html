<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Desk — Curated News</title>
<meta name="description" content="A hand-curated news feed. No algorithm, just journalists worth reading." />
<meta name="theme-color" content="#142850" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

<header class="masthead">
  <div class="masthead-top">
    <h1 class="masthead-name" data-i18n="appName">THE DESK<span class="mark">.</span></h1>
    <div class="masthead-controls">
      <select class="lang-select" id="langSelect" aria-label="Language">
        <option value="en">EN</option>
        <option value="mr">मराठी</option>
      </select>
    </div>
  </div>
  <div class="dateline" id="dateline"></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>

<main id="content"></main>

<footer class="app-footer" data-i18n="footerNote">Curated by hand. Every link chosen on purpose.</footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
